<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="720" viewBox="0 0 1400 720" role="img" aria-labelledby="title desc">
  <title id="title">Autopilot architecture</title><desc id="desc">Candidate intake feeds a persisted task registry, scoring and execution in a worktree, verification, GitHub PR and CI processing, reports, and dashboard export.</desc>
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#475569"/></marker><style>.b{fill:#f8fafc}.c{fill:#e0f2fe;stroke:#0284c7;stroke-width:2}.e{fill:#ecfdf5;stroke:#059669;stroke-width:2}.p{fill:#fff7ed;stroke:#ea580c;stroke-width:2}.w{fill:#fef2f2;stroke:#dc2626;stroke-width:2}.l{stroke:#475569;stroke-width:2;fill:none;marker-end:url(#a)}.d{stroke-dasharray:7 5}.h{font:700 25px system-ui;fill:#0f172a}.x{font:600 16px system-ui;fill:#0f172a}.n{font:14px system-ui;fill:#334155}</style></defs>
  <rect class="b" width="1400" height="720"/><text class="h" x="40" y="44">Repository autopilot: intake, execution, gates, and projections</text>
  <rect class="p" x="35" y="95" width="220" height="160" rx="12"/><text class="x" x="145" y="128" text-anchor="middle">Candidate sources</text><text class="n" x="145" y="158" text-anchor="middle">manual / ohmo</text><text class="n" x="145" y="183" text-anchor="middle">GitHub issues + PRs</text><text class="n" x="145" y="208" text-anchor="middle">local candidates</text>
  <rect class="c" x="320" y="105" width="230" height="140" rx="12"/><text class="x" x="435" y="138" text-anchor="middle">Registry + journal</text><text class="n" x="435" y="166" text-anchor="middle">fingerprint + score + status</text><text class="n" x="435" y="191" text-anchor="middle">active context + policies</text><text class="n" x="435" y="216" text-anchor="middle">RepoAutopilotStore</text>
  <rect class="e" x="620" y="95" width="220" height="160" rx="12"/><text class="x" x="730" y="128" text-anchor="middle">Worktree agent</text><text class="n" x="730" y="158" text-anchor="middle">prepare branch</text><text class="n" x="730" y="183" text-anchor="middle">shared runtime/model</text><text class="n" x="730" y="208" text-anchor="middle">full-auto by default</text>
  <rect class="p" x="910" y="95" width="220" height="160" rx="12"/><text class="x" x="1020" y="128" text-anchor="middle">Verification</text><text class="n" x="1020" y="158" text-anchor="middle">argv by default</text><text class="n" x="1020" y="183" text-anchor="middle">explicit shell opt-in</text><text class="n" x="1020" y="208" text-anchor="middle">reports + repair decision</text>
  <rect class="e" x="1170" y="95" width="200" height="160" rx="12"/><text class="x" x="1270" y="128" text-anchor="middle">GitHub</text><text class="n" x="1270" y="158" text-anchor="middle">branch + PR</text><text class="n" x="1270" y="183" text-anchor="middle">checks + comments</text><text class="n" x="1270" y="208" text-anchor="middle">draft + mode/label gate</text>
  <path class="l" d="M255 175H320"/><path class="l" d="M550 175H620"/><path class="l" d="M840 175H910"/><path class="l" d="M1130 175H1170"/>
  <path class="l d" d="M1020 255C1020 320 730 320 730 255"/><text class="n" x="875" y="342" text-anchor="middle">bounded repair</text>
  <rect class="c" x="320" y="405" width="230" height="110" rx="12"/><text class="x" x="435" y="440" text-anchor="middle">Run evidence</text><text class="n" x="435" y="468" text-anchor="middle">run + verification reports</text><text class="n" x="435" y="492" text-anchor="middle">branch/worktree/PR identity</text>
  <rect class="c" x="660" y="405" width="230" height="110" rx="12"/><text class="x" x="775" y="440" text-anchor="middle">Dashboard snapshot</text><text class="n" x="775" y="468" text-anchor="middle">generated JSON/static site</text><text class="n" x="775" y="492" text-anchor="middle">not authoritative state</text>
  <rect class="w" x="1000" y="405" width="300" height="110" rx="12"/><text class="x" x="1150" y="440" text-anchor="middle">External side effects</text><text class="n" x="1150" y="468" text-anchor="middle">push, comment, PR, merge</text><text class="n" x="1150" y="492" text-anchor="middle">not rolled back by local restore</text>
  <path class="l" d="M435 245V405"/><path class="l" d="M550 460H660"/><path class="l" d="M1270 255V405"/>
  <text class="n" x="700" y="630" text-anchor="middle">Local files, Git, model calls, and GitHub state are coordinated but not one transaction.</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="820" viewBox="0 0 1400 820" role="img" aria-labelledby="title desc">
  <title id="title">Extension and tool trust boundaries</title>
  <desc id="desc">Untrusted model and project inputs enter registries, then model tool calls pass through validation, immutable denials, configurable permission policy, hooks, and optional sandbox routing before side effects.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#475569"/></marker>
    <style>.bg{fill:#f8fafc}.untrusted{fill:#fef2f2;stroke:#dc2626;stroke-width:2}.gate{fill:#fff7ed;stroke:#ea580c;stroke-width:2}.trusted{fill:#ecfdf5;stroke:#059669;stroke-width:2}.neutral{fill:#e0f2fe;stroke:#0284c7;stroke-width:2}.zone{fill:#fff;stroke:#94a3b8;stroke-width:2}.line{stroke:#475569;stroke-width:2;fill:none;marker-end:url(#arrow)}.dash{stroke-dasharray:7 5}.title{font:700 25px system-ui,sans-serif;fill:#0f172a}.section{font:700 14px system-ui,sans-serif;fill:#475569}.label{font:600 16px system-ui,sans-serif;fill:#0f172a}.small{font:14px system-ui,sans-serif;fill:#334155}.tiny{font:13px system-ui,sans-serif;fill:#475569}</style>
  </defs>
  <rect class="bg" width="1400" height="820"/>
  <text class="title" x="40" y="42">Extension discovery and tool-execution trust boundaries</text>

  <rect class="zone" x="30" y="70" width="360" height="300" rx="14"/>
  <text class="section" x="52" y="99">INPUTS WITH DIFFERENT TRUST LEVELS</text>
  <rect class="untrusted" x="55" y="120" width="310" height="56" rx="9"/><text class="label" x="210" y="153" text-anchor="middle">Model output / prompt content</text>
  <rect class="untrusted" x="55" y="195" width="310" height="56" rx="9"/><text class="label" x="210" y="228" text-anchor="middle">Project skills and files</text>
  <rect class="gate" x="55" y="270" width="310" height="75" rx="9"/><text class="label" x="210" y="300" text-anchor="middle">Project plugin code</text><text class="small" x="210" y="324" text-anchor="middle">disabled unless explicitly enabled</text>

  <rect class="zone" x="505" y="70" width="360" height="300" rx="14"/>
  <text class="section" x="527" y="99">DISCOVERY AND REGISTRATION</text>
  <rect class="neutral" x="530" y="120" width="310" height="56" rx="9"/><text class="label" x="685" y="153" text-anchor="middle">Skill registry + provenance</text>
  <rect class="neutral" x="530" y="195" width="310" height="56" rx="9"/><text class="label" x="685" y="228" text-anchor="middle">Built-in / plugin tool registry</text>
  <rect class="neutral" x="530" y="270" width="310" height="75" rx="9"/><text class="label" x="685" y="300" text-anchor="middle">MCP connections and adapters</text><text class="small" x="685" y="324" text-anchor="middle">partial availability is reported</text>

  <rect class="zone" x="980" y="70" width="390" height="300" rx="14"/>
  <text class="section" x="1002" y="99">TRUSTED EXECUTION CAPABILITIES</text>
  <rect class="trusted" x="1005" y="120" width="340" height="56" rx="9"/><text class="label" x="1175" y="153" text-anchor="middle">Core and explicitly trusted plugins</text>
  <rect class="trusted" x="1005" y="195" width="340" height="56" rx="9"/><text class="label" x="1175" y="228" text-anchor="middle">Configured hooks / MCP servers</text>
  <rect class="trusted" x="1005" y="270" width="340" height="75" rx="9"/><text class="label" x="1175" y="300" text-anchor="middle">Host or Docker side effects</text><text class="small" x="1175" y="324" text-anchor="middle">coverage depends on the tool</text>

  <path class="line" d="M365 148H530"/><path class="line" d="M365 223H530"/><path class="line" d="M365 307H530"/>
  <path class="line dash" d="M840 148H1005"/><text class="tiny" x="922" y="138" text-anchor="middle">context only</text>
  <path class="line" d="M840 223H1005"/><path class="line" d="M840 307H1005"/>

  <rect class="zone" x="30" y="430" width="1340" height="335" rx="14"/>
  <text class="section" x="52" y="459">EVERY MODEL-REQUESTED TOOL CALL</text>
  <rect class="gate" x="55" y="500" width="160" height="75" rx="9"/><text class="label" x="135" y="530" text-anchor="middle">1. Pre-hook</text><text class="small" x="135" y="553" text-anchor="middle">raw input; may block</text>
  <rect class="neutral" x="245" y="500" width="160" height="75" rx="9"/><text class="label" x="325" y="530" text-anchor="middle">2. Resolve</text><text class="small" x="325" y="553" text-anchor="middle">then validate</text>
  <rect class="untrusted" x="435" y="500" width="190" height="75" rx="9"/><text class="label" x="530" y="530" text-anchor="middle">3. Hard denial</text><text class="small" x="530" y="553" text-anchor="middle">sensitive paths first</text>
  <rect class="gate" x="655" y="500" width="190" height="75" rx="9"/><text class="label" x="750" y="530" text-anchor="middle">4. Permission</text><text class="small" x="750" y="553" text-anchor="middle">rules, mode, approval</text>
  <rect class="trusted" x="875" y="500" width="160" height="75" rx="9"/><text class="label" x="955" y="530" text-anchor="middle">5. Execute</text><text class="small" x="955" y="553" text-anchor="middle">host / sandbox</text>
  <rect class="neutral" x="1065" y="500" width="160" height="75" rx="9"/><text class="label" x="1145" y="530" text-anchor="middle">6. Normalize</text><text class="small" x="1145" y="553" text-anchor="middle">result / error</text>
  <rect class="gate" x="1245" y="500" width="100" height="75" rx="9"/><text class="label" x="1295" y="530" text-anchor="middle">7.</text><text class="small" x="1295" y="553" text-anchor="middle">post-hook</text>
  <path class="line" d="M215 537H245M405 537H435M625 537H655M845 537H875M1035 537H1065M1225 537H1245"/>
  <rect class="gate" x="940" y="620" width="400" height="85" rx="9"/>
  <text class="label" x="1140" y="651" text-anchor="middle">Post-hook + stream + replay</text>
  <text class="small" x="1140" y="676" text-anchor="middle">normalized error results remain model-visible</text>
  <path class="line" d="M1295 575V620"/>
  <text class="tiny" x="65" y="640">Pre-hooks see raw, possibly unknown, invalid, or later-denied calls.</text>
  <text class="tiny" x="65" y="666">They are trusted policy code and must validate hostile payloads.</text>
  <text class="tiny" x="65" y="692">Full-auto removes confirmation, not hard denial. Sandbox does not replace policy.</text>
</svg>

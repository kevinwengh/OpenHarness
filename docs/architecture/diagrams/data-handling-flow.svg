<svg xmlns="http://www.w3.org/2000/svg" width="1300" height="700" viewBox="0 0 1300 700" role="img" aria-labelledby="title desc">
  <title id="title">OpenHarness data handling flow</title><desc id="desc">Prompts, context, provider calls, tools, hooks, and local persistence exchange data across explicit external and durable boundaries.</desc>
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#475569"/></marker><style>.b{fill:#f8fafc}.q{fill:#e0f2fe;stroke:#0284c7;stroke-width:2}.e{fill:#ecfdf5;stroke:#059669;stroke-width:2}.p{fill:#fff7ed;stroke:#ea580c;stroke-width:2}.w{fill:#fef2f2;stroke:#dc2626;stroke-width:2}.l{stroke:#475569;stroke-width:2;fill:none;marker-end:url(#a)}.d{stroke-dasharray:7 5}.h{font:700 25px system-ui;fill:#0f172a}.x{font:600 16px system-ui;fill:#0f172a}.n{font:14px system-ui;fill:#334155}</style></defs>
  <rect class="b" width="1300" height="700"/><text class="h" x="40" y="44">Prompt, provider, tool, and persistence data flow</text>
  <rect class="q" x="45" y="110" width="220" height="90" rx="12"/><text class="x" x="155" y="145" text-anchor="middle">Ingress</text><text class="n" x="155" y="171" text-anchor="middle">local user or channel</text>
  <rect class="q" x="330" y="110" width="260" height="90" rx="12"/><text class="x" x="460" y="145" text-anchor="middle">Prompt assembly</text><text class="n" x="460" y="171" text-anchor="middle">instructions + memory + context</text>
  <rect class="e" x="670" y="90" width="250" height="130" rx="12"/><text class="x" x="795" y="128" text-anchor="middle">External model provider</text><text class="n" x="795" y="155" text-anchor="middle">system + messages + tool schemas</text><text class="n" x="795" y="179" text-anchor="middle">stream + usage + tool requests</text>
  <rect class="p" x="1010" y="110" width="240" height="90" rx="12"/><text class="x" x="1130" y="145" text-anchor="middle">Tool governance</text><text class="n" x="1130" y="171" text-anchor="middle">hooks + permission + execution</text>
  <rect class="e" x="1010" y="300" width="240" height="100" rx="12"/><text class="x" x="1130" y="338" text-anchor="middle">External integrations</text><text class="n" x="1130" y="364" text-anchor="middle">MCP, web, GitHub, channels</text>
  <rect class="q" x="670" y="300" width="250" height="100" rx="12"/><text class="x" x="795" y="338" text-anchor="middle">Normalized history</text><text class="n" x="795" y="364" text-anchor="middle">tool-use/result replay + compaction</text>
  <rect class="p" x="330" y="300" width="260" height="100" rx="12"/><text class="x" x="460" y="338" text-anchor="middle">Local durable state</text><text class="n" x="460" y="364" text-anchor="middle">sessions, memory, logs, artifacts</text>
  <rect class="w" x="45" y="300" width="220" height="100" rx="12"/><text class="x" x="155" y="338" text-anchor="middle">Credential sources</text><text class="n" x="155" y="364" text-anchor="middle">keyring, plaintext files, env</text>
  <path class="l" d="M265 155H330"/><path class="l" d="M590 155H670"/><path class="l" d="M920 155H1010"/><path class="l" d="M1130 200V300"/><path class="l" d="M1010 350H920"/><path class="l" d="M795 300V220"/><path class="l" d="M670 350H590"/><path class="l" d="M460 300V200"/><path class="l d" d="M265 350H330"/><path class="l d" d="M155 300V200"/>
  <rect class="w" x="180" y="500" width="940" height="130" rx="12"/><text class="x" x="650" y="535" text-anchor="middle">Privacy boundary</text><text class="n" x="650" y="563" text-anchor="middle">Shape sanitization is not content redaction. Providers, hooks, MCP, channels,</text><text class="n" x="650" y="587" text-anchor="middle">logs, and snapshots may receive private text. Retention and deletion remain operator-owned</text><text class="n" x="650" y="611" text-anchor="middle">across local files, external services, Git, backups, and shell/process history.</text>
</svg>

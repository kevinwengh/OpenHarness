<svg xmlns="http://www.w3.org/2000/svg" width="1250" height="560" viewBox="0 0 1250 560" role="img" aria-labelledby="title desc">
  <title id="title">Core bridge session lifecycle</title><desc id="desc">A local bridge slash command validates or encodes a work secret and can spawn a shell child whose output and process state are managed locally.</desc>
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#475569"/></marker><style>.b{fill:#f8fafc}.c{fill:#e0f2fe;stroke:#0284c7;stroke-width:2}.p{fill:#fff7ed;stroke:#ea580c;stroke-width:2}.e{fill:#ecfdf5;stroke:#059669;stroke-width:2}.w{fill:#fef2f2;stroke:#dc2626;stroke-width:2}.l{stroke:#475569;stroke-width:2;fill:none;marker-end:url(#a)}.h{font:700 25px system-ui;fill:#0f172a}.x{font:600 16px system-ui;fill:#0f172a}.n{font:14px system-ui;fill:#334155}</style></defs>
  <rect class="b" width="1250" height="560"/><text class="h" x="40" y="44">Core bridge command, process, and log lifecycle</text>
  <rect class="c" x="40" y="120" width="190" height="80" rx="10"/><text class="x" x="135" y="152" text-anchor="middle">/bridge handler</text><text class="n" x="135" y="177" text-anchor="middle">local admin command</text>
  <rect class="p" x="290" y="100" width="220" height="120" rx="10"/><text class="x" x="400" y="134" text-anchor="middle">Work-secret helpers</text><text class="n" x="400" y="160" text-anchor="middle">version + token + base URL</text><text class="n" x="400" y="184" text-anchor="middle">base64url, not encryption</text>
  <rect class="c" x="570" y="120" width="220" height="80" rx="10"/><text class="x" x="680" y="152" text-anchor="middle">BridgeSessionManager</text><text class="n" x="680" y="177" text-anchor="middle">process-local singleton</text>
  <rect class="e" x="850" y="120" width="180" height="80" rx="10"/><text class="x" x="940" y="152" text-anchor="middle">Shell child</text><text class="n" x="940" y="177" text-anchor="middle">resolved cwd</text>
  <rect class="p" x="1080" y="120" width="130" height="80" rx="10"/><text class="x" x="1145" y="152" text-anchor="middle">Output log</text><text class="n" x="1145" y="177" text-anchor="middle">data/bridge</text>
  <path class="l" d="M230 160H290"/><path class="l" d="M230 180C380 280 500 180 570 160"/><path class="l" d="M790 160H850"/><path class="l" d="M1030 160H1080"/>
  <rect class="w" x="270" y="335" width="710" height="120" rx="12"/><text class="x" x="625" y="370" text-anchor="middle">Lifecycle limits</text><text class="n" x="625" y="398" text-anchor="middle">Shell semantics; secrets can appear in argv/logs; process records do not survive restart.</text><text class="n" x="625" y="422" text-anchor="middle">Configured max-session/timeout fields are not enforced by the current manager spawn path.</text><text class="n" x="625" y="446" text-anchor="middle">No close-all or automatic log-retention contract.</text>
  <path class="l" d="M680 200V335"/>
</svg>

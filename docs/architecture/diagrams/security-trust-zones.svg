<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="760" viewBox="0 0 1400 760" role="img" aria-labelledby="title desc">
  <title id="title">OpenHarness security trust zones</title><desc id="desc">Untrusted prompts, projects, channels, and external responses cross validation, permission, hook, and sandbox controls before trusted local or external side effects.</desc>
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#475569"/></marker><style>.b{fill:#f8fafc}.z{fill:#fff;stroke:#94a3b8;stroke-width:2}.u{fill:#fef2f2;stroke:#dc2626;stroke-width:2}.g{fill:#fff7ed;stroke:#ea580c;stroke-width:2}.t{fill:#ecfdf5;stroke:#059669;stroke-width:2}.c{fill:#e0f2fe;stroke:#0284c7;stroke-width:2}.l{stroke:#475569;stroke-width:2;fill:none;marker-end:url(#a)}.d{stroke-dasharray:7 5}.h{font:700 26px system-ui;fill:#0f172a}.s{font:700 14px system-ui;fill:#475569}.x{font:600 16px system-ui;fill:#0f172a}.n{font:14px system-ui;fill:#334155}</style></defs>
  <rect class="b" width="1400" height="760"/><text class="h" x="40" y="44">Security trust zones and enforcement points</text>
  <rect class="z" x="30" y="80" width="320" height="570" rx="16"/><text class="s" x="55" y="112">UNTRUSTED INPUT</text>
  <rect class="u" x="60" y="145" width="260" height="70" rx="10"/><text class="x" x="190" y="174" text-anchor="middle">Prompts + model output</text><text class="n" x="190" y="197" text-anchor="middle">raw tool names and arguments</text>
  <rect class="u" x="60" y="245" width="260" height="70" rx="10"/><text class="x" x="190" y="274" text-anchor="middle">Project + downloaded data</text><text class="n" x="190" y="297" text-anchor="middle">skills, files, issue/PR text</text>
  <rect class="u" x="60" y="345" width="260" height="70" rx="10"/><text class="x" x="190" y="374" text-anchor="middle">Remote ingress</text><text class="n" x="190" y="397" text-anchor="middle">channels, MCP, web results</text>
  <rect class="g" x="60" y="475" width="260" height="100" rx="10"/><text class="x" x="190" y="506" text-anchor="middle">Explicit trust expansion</text><text class="n" x="190" y="532" text-anchor="middle">plugins, hooks, MCP servers</text><text class="n" x="190" y="554" text-anchor="middle">full-auto and policy files</text>
  <rect class="z" x="415" y="80" width="550" height="570" rx="16"/><text class="s" x="440" y="112">CORE ENFORCEMENT</text>
  <rect class="c" x="450" y="145" width="220" height="70" rx="10"/><text class="x" x="560" y="174" text-anchor="middle">Normalize + validate</text><text class="n" x="560" y="197" text-anchor="middle">messages, schemas, identities</text>
  <rect class="g" x="710" y="145" width="220" height="70" rx="10"/><text class="x" x="820" y="174" text-anchor="middle">Authorize ingress</text><text class="n" x="820" y="197" text-anchor="middle">allowlists, mentions, keys</text>
  <rect class="g" x="450" y="275" width="220" height="90" rx="10"/><text class="x" x="560" y="305" text-anchor="middle">Tool governance</text><text class="n" x="560" y="331" text-anchor="middle">pre-hook → lookup → validate</text><text class="n" x="560" y="353" text-anchor="middle">hard denial → permission</text>
  <rect class="g" x="710" y="275" width="220" height="90" rx="10"/><text class="x" x="820" y="305" text-anchor="middle">Execution scope</text><text class="n" x="820" y="331" text-anchor="middle">host or tool-specific sandbox</text><text class="n" x="820" y="353" text-anchor="middle">network/path checks</text>
  <rect class="c" x="450" y="425" width="220" height="90" rx="10"/><text class="x" x="560" y="455" text-anchor="middle">Persistence boundary</text><text class="n" x="560" y="481" text-anchor="middle">sanitize shapes, atomic files</text><text class="n" x="560" y="503" text-anchor="middle">not content redaction</text>
  <rect class="c" x="710" y="425" width="220" height="90" rx="10"/><text class="x" x="820" y="455" text-anchor="middle">Lifecycle ownership</text><text class="n" x="820" y="481" text-anchor="middle">close tasks, clients, MCP</text><text class="n" x="820" y="503" text-anchor="middle">best-effort gaps remain</text>
  <rect class="z" x="1030" y="80" width="340" height="570" rx="16"/><text class="s" x="1055" y="112">SIDE EFFECTS AND DATA SINKS</text>
  <rect class="t" x="1060" y="145" width="280" height="70" rx="10"/><text class="x" x="1200" y="174" text-anchor="middle">Local machine</text><text class="n" x="1200" y="197" text-anchor="middle">files, shell, Git, processes</text>
  <rect class="t" x="1060" y="255" width="280" height="70" rx="10"/><text class="x" x="1200" y="284" text-anchor="middle">External services</text><text class="n" x="1200" y="307" text-anchor="middle">providers, channels, MCP, GitHub</text>
  <rect class="t" x="1060" y="365" width="280" height="70" rx="10"/><text class="x" x="1200" y="394" text-anchor="middle">Durable local state</text><text class="n" x="1200" y="417" text-anchor="middle">sessions, memory, logs, artifacts</text>
  <rect class="u" x="1060" y="495" width="280" height="90" rx="10"/><text class="x" x="1200" y="525" text-anchor="middle">Residual risk</text><text class="n" x="1200" y="551" text-anchor="middle">no universal rollback, DLP,</text><text class="n" x="1200" y="573" text-anchor="middle">or multi-host isolation</text>
  <path class="l" d="M350 180H450"/><path class="l" d="M350 380H710"/><path class="l" d="M670 320H710"/><path class="l" d="M930 320H1060"/><path class="l" d="M930 470H1060"/><path class="l d" d="M320 525C390 525 390 210 450 210"/>
  <text class="n" x="700" y="700" text-anchor="middle">Controls are layered. Enabling a trusted extension or full-auto mode expands authority; it does not prove safety.</text>
</svg>

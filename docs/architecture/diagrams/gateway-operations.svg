<svg xmlns="http://www.w3.org/2000/svg" width="1350" height="650" viewBox="0 0 1350 650" role="img" aria-labelledby="title desc">
  <title id="title">ohmo gateway operational lifecycle</title><desc id="desc">The gateway service owns state files, channel manager, message bridge, runtime pool, snapshots, and graceful shutdown in one local process.</desc>
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#475569"/></marker><style>.b{fill:#f8fafc}.c{fill:#e0f2fe;stroke:#0284c7;stroke-width:2}.e{fill:#ecfdf5;stroke:#059669;stroke-width:2}.p{fill:#fff7ed;stroke:#ea580c;stroke-width:2}.w{fill:#fef2f2;stroke:#dc2626;stroke-width:2}.l{stroke:#475569;stroke-width:2;fill:none;marker-end:url(#a)}.d{stroke-dasharray:7 5}.h{font:700 25px system-ui;fill:#0f172a}.x{font:600 16px system-ui;fill:#0f172a}.n{font:14px system-ui;fill:#334155}</style></defs>
  <rect class="b" width="1350" height="650"/><text class="h" x="40" y="44">ohmo gateway: startup, message path, health, and recovery</text>
  <rect class="p" x="35" y="110" width="200" height="90" rx="10"/><text class="x" x="135" y="144" text-anchor="middle">gateway.json</text><text class="n" x="135" y="170" text-anchor="middle">profiles + channel secrets</text>
  <rect class="c" x="300" y="95" width="240" height="120" rx="12"/><text class="x" x="420" y="132" text-anchor="middle">OhmoGatewayService</text><text class="n" x="420" y="158" text-anchor="middle">PID/state/log + lifecycle</text><text class="n" x="420" y="182" text-anchor="middle">restart notice + heartbeat</text>
  <rect class="e" x="610" y="90" width="220" height="100" rx="10"/><text class="x" x="720" y="126" text-anchor="middle">ChannelManager</text><text class="n" x="720" y="152" text-anchor="middle">adapters + outbound dispatch</text>
  <rect class="e" x="610" y="250" width="220" height="100" rx="10"/><text class="x" x="720" y="286" text-anchor="middle">Gateway bridge</text><text class="n" x="720" y="312" text-anchor="middle">authorize + key + cancellation</text>
  <rect class="c" x="910" y="250" width="220" height="100" rx="10"/><text class="x" x="1020" y="286" text-anchor="middle">Runtime pool</text><text class="n" x="1020" y="312" text-anchor="middle">one bundle per session key</text>
  <rect class="p" x="910" y="90" width="220" height="100" rx="10"/><text class="x" x="1020" y="126" text-anchor="middle">Workspace state</text><text class="n" x="1020" y="152" text-anchor="middle">sessions + memory + media</text>
  <path class="l" d="M235 155H300"/><path class="l" d="M540 135H610"/><path class="l" d="M720 190V250"/><path class="l" d="M830 300H910"/><path class="l" d="M1020 250V190"/><path class="l d" d="M910 140H830"/>
  <rect class="w" x="275" y="450" width="800" height="115" rx="12"/><text class="x" x="675" y="485" text-anchor="middle">Restart and failure boundary</text><text class="n" x="675" y="513" text-anchor="middle">Graceful stop cancels/awaits owned tasks and channels. Restart reconstructs bundles lazily from snapshots.</text><text class="n" x="675" y="537" text-anchor="middle">Queues, transient progress, and unsaved turns are lost; pool state is process-local and unbounded.</text>
  <path class="l" d="M420 215V450"/>
</svg>
